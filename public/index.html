<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent rooms</title>
<meta name="description" content="Multiplayer coding agents on Cloudflare Durable Objects. Share the URL; everyone edits the brief and watches the agent work." />
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #0e0e0e;
    --line: #1e1e1e;
    --line-soft: #171717;
    --text: #e8e8e8;
    --muted: #7a7a7a;
    --dim: #4a4a4a;
    --lime: #a3e635;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------------------------------------------------- top bar */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    height: 46px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  .brand { color: var(--lime); font-family: var(--mono); font-size: 13px; letter-spacing: .02em; flex: none; }
  #title {
    background: transparent; border: 0; outline: 0; color: var(--text);
    font-family: var(--mono); font-size: 13px; width: 260px; padding: 4px 6px; border-radius: 4px;
  }
  #title:focus { background: #141414; }
  #title::placeholder { color: var(--dim); }
  .roomtag { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .spacer { flex: 1; }

  /* Humans are round. Agents are square, monospaced, and glow.
     One glance should answer "who in this room is a person?" */
  .rail { display: flex; align-items: center; gap: 7px; }
  .rail + .rail { margin-left: 4px; }
  .rail#agentRail .rail-label { color: rgba(163,230,53,.55); }
  .rail#agentRail.empty { opacity: .35; }
  .rail-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
    color: var(--dim); text-transform: uppercase;
  }
  #humans, #agents { display: flex; align-items: center; }
  .peer {
    width: 23px; height: 23px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 9px; font-weight: 700; color: #0a0a0a;
    margin-left: -5px; border: 2px solid var(--panel);
    font-family: var(--sans);
  }
  .peer:first-child { margin-left: 0; }
  .peer.agent {
    border-radius: 6px;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--lime), 0 0 12px rgba(163,230,53,.45);
  }
  .peer.agent.busy { animation: agentpulse 1.4s ease-in-out infinite; }

  /* Spectators are hollow rings — present, but visibly not authors. */
  .rail#specRail.empty { display: none; }
  .rail#specRail .rail-label { color: #555; }
  .peer.spectator {
    background: transparent;
    border: 1.5px dashed #4a4a4a;
    color: #7a7a7a;
    font-size: 11px; font-weight: 400;
  }
  @keyframes agentpulse {
    0%,100% { box-shadow: 0 0 0 1px var(--lime), 0 0 6px rgba(163,230,53,.35); }
    50%     { box-shadow: 0 0 0 1px var(--lime), 0 0 18px rgba(163,230,53,.85); }
  }

  #status {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    display: flex; align-items: center; gap: 6px;
  }
  #status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim);
  }
  #status.live { color: var(--lime); }
  #status.live::before { background: var(--lime); box-shadow: 0 0 8px var(--lime); }

  button {
    font-family: var(--mono); font-size: 11px;
    background: #141414; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 11px; cursor: pointer;
  }
  button:hover { border-color: #333; background: #171717; }
  #run { border-color: #2f3d16; color: var(--lime); background: #131a08; }
  #run:hover { background: #18220a; }
  #run.stop { border-color: #4a1d1d; color: #f87171; background: #1a0d0d; }
  #share.ok, #watch.ok { color: var(--lime); border-color: #2f3d16; }

  /* Watch-only tab: the write affordances are gone, not merely inert. */
  body.spectating #run, body.spectating footer .kbd { display: none; }
  body.spectating #composer { opacity: .45; cursor: default; }
  body.spectating #brief { caret-color: transparent; }
  body.spectating #title { pointer-events: none; }
  #me { font-family: var(--mono); font-size: 11px; cursor: pointer; border-bottom: 1px dotted #333; }

  /* ------------------------------------------------------------ panes */
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  section + section { border-left: 1px solid var(--line); }
  .pane-head {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    color: var(--dim); padding: 10px 16px 8px; text-transform: uppercase;
    display: flex; gap: 10px; align-items: center; flex: none;
  }
  .pane-head .hint { text-transform: none; letter-spacing: 0; color: #333; }

  /* ----------------------------------------------------------- editor */
  .editor { position: relative; flex: 1; min-height: 0; }
  #brief, #carets { position: absolute; inset: 0; }
  #brief {
    width: 100%; height: 100%;
    background: transparent; color: var(--text);
    border: 0; outline: 0; resize: none;
    font-family: var(--mono); font-size: 13px; line-height: 22px;
    padding: 4px 16px 16px;
    white-space: pre-wrap; word-break: break-word; overflow-y: auto; overflow-x: hidden;
    caret-color: var(--lime);
    tab-size: 2;
  }
  #brief::placeholder { color: #2e2e2e; }
  #carets { pointer-events: none; overflow: hidden; }

  /* A human caret is a thin line with a rounded name tag.
     An agent caret is thicker, glows, drags a spotlight across the whole line,
     and says what it is doing there. */
  .caret { position: absolute; width: 2px; border-radius: 1px; }
  /* The label sits just above the caret. Lines are tight, so it is kept small
     and ringed in the page background — it reads as an overlay instead of
     smudging the line above. */
  .flag {
    position: absolute; top: -11px; left: 0; white-space: nowrap;
    font-family: var(--sans); font-size: 8.5px; font-weight: 600; color: #0a0a0a;
    padding: 0 4px; line-height: 12px; border-radius: 3px 3px 3px 0;
    box-shadow: 0 0 0 1.5px var(--bg);
  }
  .caret.agent { width: 3px; box-shadow: 0 0 10px var(--lime); animation: caretpulse 1.2s ease-in-out infinite; }
  .caret.agent .flag {
    font-family: var(--mono); font-size: 9.5px; font-weight: 500;
    border-radius: 4px; letter-spacing: .01em;
    box-shadow: 0 0 14px rgba(163,230,53,.5);
  }
  @keyframes caretpulse { 50% { opacity: .55; } }
  .lineglow {
    position: absolute; left: 0; right: 0;
    background: linear-gradient(90deg, rgba(163,230,53,.14), rgba(163,230,53,.02));
    border-left: 2px solid var(--lime);
    pointer-events: none;
  }

  /* ------------------------------------------------------------- feed */
  #feed { flex: 1; overflow-y: auto; padding: 4px 16px 16px; font-size: 12.5px; }
  .row { display: grid; grid-template-columns: 8px auto 1fr; gap: 8px; align-items: baseline; padding: 3px 0; }
  .dot { width: 5px; height: 5px; border-radius: 50%; align-self: center; }
  .who { font-family: var(--mono); font-size: 10.5px; opacity: .85; }

  /* Anything an agent said carries a lime spine. Anything a human said does not.
     Scanning the feed should never require reading a name. */
  .row.by-agent { border-left: 2px solid rgba(163,230,53,.55); margin-left: -10px; padding-left: 8px; }
  .row.by-agent .dot { border-radius: 2px; width: 6px; height: 6px; }
  .row.by-human .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.06); }
  .body { font-family: var(--mono); font-size: 12px; line-height: 19px; color: #cfcfcf; white-space: pre-wrap; word-break: break-word; }
  .row.system .body, .row.join .body { color: var(--dim); font-style: italic; }
  .row.tool .body { color: var(--muted); }
  .row.edit .body { color: var(--lime); }
  .row.steer { background: #10161f; margin: 4px -8px; padding: 5px 8px; border-left: 2px solid #38bdf8; border-radius: 0 4px 4px 0; }
  .row.steer .body { color: #d6e6f5; }
  .row.streaming .body::after {
    content: "▍"; color: var(--lime); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* --------------------------------------------------------- composer */
  footer { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 9px 14px; display: flex; gap: 10px; align-items: center; }
  #composer {
    flex: 1; background: #131313; border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-family: var(--mono); font-size: 12px; padding: 9px 12px; outline: 0;
  }
  #composer:focus { border-color: #2f3d16; }
  #composer::placeholder { color: #3a3a3a; }
  .kbd { font-family: var(--mono); font-size: 10px; color: var(--dim); flex: none; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    section + section { border-left: 0; border-top: 1px solid var(--line); }
    #title { width: 120px; }
  }
</style>
</head>
<body>
  <header>
    <span class="brand">◆ agent rooms</span>
    <input id="title" placeholder="name this room…" spellcheck="false" />
    <span class="roomtag">#<span id="roomName"></span></span>
    <span class="spacer"></span>
    <span id="me">you</span>
    <div class="rail"><span class="rail-label"><span id="humanCount">0</span> human</span><div id="humans"></div></div>
    <div class="rail" id="agentRail"><span class="rail-label"><span id="agentCount">0</span> agent</span><div id="agents"></div></div>
    <div class="rail empty" id="specRail"><span class="rail-label"><span id="specCount">0</span> watching</span><div id="specs"></div></div>
    <span id="status">connecting</span>
    <button id="share">Share link</button>
    <button id="watch" hidden>Watch link</button>
    <button id="run">Run agent</button>
  </header>

  <main>
    <section>
      <div class="pane-head">Shared brief <span class="hint">everyone types here at once</span></div>
      <div class="editor">
        <textarea id="brief" spellcheck="false"
          placeholder="# What are we building?&#10;&#10;Type here. Anyone with the link sees it as you type,&#10;and the agent reads it while it works."></textarea>
        <div id="carets"></div>
      </div>
    </section>

    <section>
      <div class="pane-head">Agent stream <span class="hint">what the agents are doing, live</span></div>
      <div id="feed"></div>
    </section>
  </main>

  <footer>
    <input id="composer" placeholder="steer the agents…  (enter to send)" spellcheck="false" autocomplete="off" />
    <span class="kbd">enter → steer · button → run</span>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
